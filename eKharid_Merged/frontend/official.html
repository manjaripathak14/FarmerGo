<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Portal - e-Kharid</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .official-content { width:100%; max-width:1050px; margin:0 auto; }
        .official-title { color:#234d3c; font-size:42px; font-weight:800; margin:0 0 8px; }
        .official-subtitle { color:#65776d; margin-bottom:25px; }
        .official-card { background:white; border:1px solid #dce9df; border-radius:16px; padding:24px; margin-bottom:22px; box-shadow:0 8px 25px rgba(35,77,60,.08); }
        .official-card h2,.official-card h3 { color:#234d3c; margin-top:0; }
        .official-form-row { display:flex; gap:14px; flex-wrap:wrap; align-items:end; }
        .official-form-row > div { flex:1; min-width:200px; }
        .official-form-row input,.official-form-row select { width:100%; padding:12px; border:1px solid #ccdacf; border-radius:8px; }
        .official-btn { background:#6d633d; color:white; border:0; border-radius:8px; padding:12px 22px; font-weight:800; cursor:pointer; }
        .official-btn:hover { background:#554c2d; }
        .farmer-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
        .farmer-card { background:#f4faef; border:1px solid #dce9df; border-radius:12px; padding:16px; cursor:pointer; transition:.2s; }
        .farmer-card:hover { transform:translateY(-3px); border-color:#6d633d; }
        .fc-id { font-weight:800; color:#234d3c; }
        .fc-gate-pass { color:#6d633d; font-size:13px; margin:6px 0; }
        .fc-stage { font-size:12px; color:#65776d; font-weight:700; }
        .field-row { display:flex; justify-content:space-between; gap:20px; padding:12px 0; border-bottom:1px solid #edf1ed; }
        .field-label { color:#718078; font-weight:700; }
        .field-value { color:#234d3c; font-weight:800; text-align:right; }
        .message { padding:12px 14px; border-radius:8px; margin:12px 0; }
        .message.error { background:#fff0ed; color:#9a4535; }
        .message.info { background:#eaf3e7; color:#587064; }
        .message.success { background:#e3f0e2; color:#37653b; }
        @media(max-width:700px){ .official-title{font-size:32px;} .field-row{flex-direction:column;} .field-value{text-align:left;} }
    </style>
</head>
<body>
<div class="website">
    <aside class="sidebar">
        <div class="sidebar-menu">
            <button class="menu-item active">Official Dashboard</button>
            <button class="menu-item" onclick="window.location.href='scanner.html'">QR Scanner</button>
            <button class="menu-item" onclick="window.location.href='queue.html'">Live Queue</button>
            <button class="menu-item" onclick="window.location.href='payment.html'">Payment</button>
            <button class="menu-item" onclick="window.location.href='index.html'">Main Dashboard</button>
            <button class="menu-item" onclick="handleLogout()">Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="official-content">
            <h1 class="official-title">Mandi Official Control Panel</h1>
            <p class="official-subtitle" id="welcome-text">Welcome!</p>

            <div class="official-card">
                <h2>Farmer Queue</h2>
                <label for="queue-date">Select Date</label>
                <input id="queue-date" type="date" onchange="loadFarmers()">
            </div>

            <div id="grid-message"></div>

            <div class="official-card">
                <div id="farmer-grid" class="farmer-grid"></div>
            </div>

            <div class="official-card" id="detail-panel" style="display:none;">
                <h3>Farmer Details</h3>
                <div id="detail-body"></div>
                <div id="detail-message"></div>
                <button class="official-btn" id="advance-btn" onclick="advanceStage()"></button>
                <button class="official-btn" onclick="closeDetails()" style="margin-left:8px; background:#877a4c;">Close</button>
            </div>
        </div>
    </main>
</div>
<script src="js/script.js"></script>
<script>
    const officer = requireOfficerLogin();
    if (officer) {
        const w = document.getElementById('welcome-text');
        if (w) w.textContent = `Welcome, ${officer.name || officer.username || 'Official'}`;
    }
    document.getElementById('queue-date').value = new Date().toISOString().split('T')[0];

    let selectedFarmerId = null;

    async function loadFarmers() {
        const date = document.getElementById('queue-date').value;
        const msg = document.getElementById('grid-message');
        const grid = document.getElementById('farmer-grid');
        if (!date) return;
        clearMessage(msg);
        grid.innerHTML = '<p>Loading...</p>';
        try {
            const entries = await apiGet(`/officer/farmers/${date}`);
            if (!entries.length) {
                grid.innerHTML = '';
                showMessage(msg, 'No farmers are scheduled for this date.', 'info');
                return;
            }
            grid.innerHTML = entries.map(e => `
                <div class="farmer-card stage-${e.stage}" onclick="openDetails('${e.farmer_id}')">
                    <div class="fc-id">${e.farmer_id}</div>
                    <div class="fc-gate-pass">${e.gate_pass_id}</div>
                    <div class="fc-stage">${stageLabel(e.stage)}</div>
                </div>`).join('');
        } catch(err) {
            grid.innerHTML='';
            showMessage(msg, err.message);
        }
    }

    async function openDetails(farmerId) {
        selectedFarmerId = farmerId;
        const panel = document.getElementById('detail-panel');
        const body = document.getElementById('detail-body');
        const msg = document.getElementById('detail-message');
        clearMessage(msg);
        panel.style.display='block';
        body.innerHTML='<p>Loading...</p>';
        try {
            const data = await apiGet(`/officer/farmer/${farmerId}`);
            window.currentDetail=data;
            const q=data.queue_info || {};
            body.innerHTML=`
                <div class="field-row"><span class="field-label">Name</span><span class="field-value">${data.farmer.name}</span></div>
                <div class="field-row"><span class="field-label">Mobile</span><span class="field-value">${data.farmer.mobile}</span></div>
                <div class="field-row"><span class="field-label">Farmer ID</span><span class="field-value">${data.farmer.farmer_id}</span></div>
                <div class="field-row"><span class="field-label">Gate Pass</span><span class="field-value">${data.gate_pass.gate_pass_id}</span></div>
                <div class="field-row"><span class="field-label">Crop</span><span class="field-value">${data.gate_pass.crop_name}</span></div>
                <div class="field-row"><span class="field-label">Quantity</span><span class="field-value">${data.gate_pass.estimated_weight} Quintals</span></div>
                <div class="field-row"><span class="field-label">Vehicle</span><span class="field-value">${data.gate_pass.vehicle_number}</span></div>
                <div class="field-row"><span class="field-label">Current Stage</span><span class="field-value">${stageLabel(data.stage)}</span></div>
                <div class="field-row"><span class="field-label">Queue Position</span><span class="field-value">${q.queue_position ?? '-'}</span></div>
                <div class="field-row"><span class="field-label">Farmers Ahead</span><span class="field-value">${q.farmers_ahead ?? '-'}</span></div>`;
            updateAdvanceButton(data.stage);
        } catch(err) {
            body.innerHTML=''; showMessage(msg,err.message);
        }
    }

    function updateAdvanceButton(stage) {
        const btn=document.getElementById('advance-btn');
        const msg=document.getElementById('detail-message');
        const i=STAGES.findIndex(s=>s.key===stage);
        if(stage==='NOT_ARRIVED') {
            btn.style.display='none';
            showMessage(msg,'This farmer has not arrived yet. Use the QR Scanner to record arrival.','info');
            return;
        }
        clearMessage(msg);
        if(i===STAGES.length-1){btn.style.display='none';return;}
        btn.style.display='inline-block';
        btn.textContent=`Move to ${STAGES[i+1].label}`;
    }

    async function advanceStage(){
        const msg=document.getElementById('detail-message');
        const d=window.currentDetail;
        const i=STAGES.findIndex(s=>s.key===d.stage);
        const next=STAGES[i+1];
        try{
            await apiPost('/stage/update',{gate_pass_id:d.gate_pass.gate_pass_id,new_stage:next.key});
            showMessage(msg,`Moved to ${next.label}.`,'success');
            await openDetails(selectedFarmerId);
            await loadFarmers();
        }catch(err){showMessage(msg,err.message);}
    }

    function closeDetails(){document.getElementById('detail-panel').style.display='none';selectedFarmerId=null;}
    loadFarmers();
</script>
</body>
</html>
