<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Kharid - Mandi Management System</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         MAIN WEBSITE
    ========================== -->

    <div class="website">

        <!-- =========================
             LEFT SIDEBAR
        ========================== -->

        <aside class="sidebar">
            <div class="sidebar-menu">

                <!-- DASHBOARD -->
                <button class="menu-item active" onclick="window.location.href='index.html'">
                    Dashboard
                </button>

                <!-- LIVE QUEUE -->
                <button class="menu-item" onclick="window.location.href='queue.html'">
                    Live Queue
                </button>

                <!-- PAYMENT -->
                <button class="menu-item" onclick="window.location.href='payment.html'">
                    Payment
                </button>

                <!-- GATE PASS -->
                <button class="menu-item" onclick="window.location.href='gatepass.html'">
                    Gate Pass
                </button>

                <!-- PROFILE -->
                <button class="menu-item" onclick="window.location.href='profile.html'">
                    Profile
                </button>

                <!-- CONTACT US -->
                <button class="menu-item" onclick="window.location.href='contact.html'">
                    Contact Us
                </button>

            </div>
        </aside>

        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main-content">

            <!-- WEBSITE NAME & LOGOUT BAR -->
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Farmer-Go</h1>
                <div class="user-info" id="userInfoDisplay">
                    <span class="user-name" id="userNameDisplay">Farmer</span> (<span class="user-role" id="userRoleDisplay">Farmer / कृषि</span>)
                    <button onclick="handleLogout()" class="login-btn" style="padding: 5px 15px; margin-left: 10px;">Logout</button>
                </div>
            </div>

            <!-- ROLE SELECTION SECTION -->
            <section class="role-section">
                <h2>YOU ARE</h2>
                <div class="roles">

                    <!-- FARMER ROLE -->
                    <button class="role-card" onclick="openLogin('Farmer / कृषि')">
                        <div class="role-image">
                            <img src="/images/farmer.png">
                        </div>
                        <h3>Farmer / कृषि</h3>
                    </button>

                    <!-- OFFICIAL ROLE -->
                    <button class="role-card" onclick="openLogin('Officials')">
                        <div class="role-image">
                            <img src="/images/official.png">
                        </div>
                        <h3>Officials</h3>
                    </button>

                </div>
            </section>

            <!-- LIVE QUEUE & PASSES SECTION -->
            <section class="card" style="margin-top: 30px;">
                <h2>Your Gate Passes & Live Queue Status</h2>
                <div id="passesContainer">
                    <p>No active gate passes found. Log in or generate a pass to see your live queue status.</p>
                </div>
            </section>

        </main>

    </div>

    <!-- =========================
         LOGIN POPUP MODAL
    ========================== -->

    <div class="modal" id="loginModal">
        <div class="login-box">

            <!-- CLOSE BUTTON -->
            <button class="close-btn" onclick="closeLogin()">&times;</button>

            <!-- LOGIN HEADING -->
            <h2>Login</h2>
            <p class="selected-role" id="selectedRole">Farmer / कृषि</p>

            <!-- LOGIN FORM -->
            <form onsubmit="handleLoginSubmit(event)">

                <!-- USERNAME -->
                <label for="username">Full Name / Username</label>
                <input id="username" type="text" placeholder="Enter name or username" required>

                <!-- MOBILE / PASSWORD -->
                <label for="mobile" id="loginSecretLabel">Mobile Number</label>
                <input id="mobile" type="text" placeholder="Enter mobile number" required>

                <!-- LOGIN BUTTON -->
                <button class="login-btn" type="submit">LOGIN</button>

            </form>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>

</body>

</html>
