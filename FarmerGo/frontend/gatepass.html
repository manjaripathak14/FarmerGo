<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gate Pass - e-Kharid</title>

    <!-- Same CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Gate Pass CSS -->
    <style>
        /* =========================
           GATE PASS PAGE
        ========================== */

        .gatepass-page {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .gatepass-title {
            text-align: center;
            font-size: clamp(38px, 5vw, 58px);
            margin-bottom: 25px;
            font-weight: 800;
        }

        .gatepass-form {
            background: #877a4c;
            padding: 35px 45px 40px;
            border-radius: 8px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
        }

        .form-heading {
            display: inline-block;
            color: #08d8ff;
            font-size: 24px;
            font-weight: 800;
            padding: 8px 18px;
            border: 2px solid #08d8ff;
            margin-bottom: 22px;
            background: #877a4c;
        }

        .form-section {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.75);
            padding: 25px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: white;
            font-weight: 600;
            margin: 0 0 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
            color: #222;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #08d8ff;
        }

        /* TIME SLOTS */

        .time-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .time-slots input {
            display: none;
        }

        .time-slots label {
            padding: 10px 18px;
            background: white;
            color: #554c2d;
            border: 2px solid transparent;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
            margin: 0;
            transition: 0.2s;
        }

        .time-slots label:hover {
            transform: translateY(-2px);
        }

        .time-slots input:checked + label {
            background: #08d8ff;
            color: #111;
            border-color: #111;
        }

        /* SUBMIT */

        .submit-container {
            text-align: center;
            margin-top: 10px;
        }

        .submit-btn {
            padding: 14px 35px;
            border: none;
            border-radius: 8px;
            background: #08d8ff;
            color: #111;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* SUCCESS MESSAGE */

        .success-message {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        .success-message h3 {
            color: #554c2d;
            margin-bottom: 8px;
        }

        .success-message p {
            color: #333;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            .gatepass-form {
                padding: 25px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .form-section {
                padding: 18px;
            }

            .time-slots {
                gap: 8px;
            }

            .time-slots label {
                padding: 9px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="website">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <div class="sidebar-menu">

                <button class="menu-item" onclick="window.location.href='index.html'">
                    Dashboard
                </button>

                <button class="menu-item" onclick="window.location.href='queue.html'">
                    Live Queue
                </button>

                <button class="menu-item" onclick="window.location.href='payment.html'">
                    Payment
                </button>

                <button class="menu-item active">
                    Gate Pass
                </button>

                <button class="menu-item" onclick="window.location.href='profile.html'">
                    Profile
                </button>

                <button class="menu-item" onclick="window.location.href='contact.html'">
                    Contact Us
                </button>

            </div>

        </aside>

        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main class="main-content">

            <div class="gatepass-page">

                <h1 class="gatepass-title">
                    Gate Pass
                </h1>

                <form class="gatepass-form" id="gatePassForm" onsubmit="handleGatePassSubmit(event)">

                    <!-- =========================
                         PERSONAL INFORMATION
                    ========================== -->

                    <section class="form-section">

                        <h2 class="form-heading">
                            Personal Info
                        </h2>

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="name">
                                    Name
                                </label>

                                <input type="text" id="name" placeholder="Enter your name" required>
                            </div>

                            <div class="form-group">
                                <label for="phone">
                                    Phone No.
                                </label>

                                <input type="tel" id="phone" placeholder="Enter phone number" required>
                            </div>

                            <div class="form-group">
                                <label for="fatherName">
                                    Father's Name
                                </label>

                                <input type="text" id="fatherName" placeholder="Enter father's name" required>
                            </div>

                            <div class="form-group">
                                <label for="aadhaar">
                                    Aadhaar No.
                                </label>

                                <input type="text" id="aadhaar" placeholder="Enter Aadhaar number" maxlength="12" required>
                            </div>

                        </div>

                    </section>

                    <!-- =========================
                         CROP DETAILS
                    ========================== -->

                    <section class="form-section">

                        <h2 class="form-heading">
                            Crop Details
                        </h2>

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="cropName">
                                    Crop Name
                                </label>

                                <select id="cropName" required>
                                    <option value="">Select Crop</option>
                                    <option value="Wheat">Wheat</option>
                                    <option value="Rice">Rice</option>
                                    <option value="Maize">Maize</option>
                                    <option value="Mustard">Mustard</option>
                                    <option value="Bajra">Bajra</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="cropType">
                                    Crop Type
                                </label>

                                <input type="text" id="cropType" placeholder="e.g. Rabi / Kharif / Cereal" required>
                            </div>

                            <div class="form-group">
                                <label for="estimatedWeight">
                                    Quantity / Estimated Weight (Quintals)
                                </label>

                                <input type="number" id="estimatedWeight" placeholder="Enter quantity in Quintals" step="0.1" min="0.1" required>
                            </div>

                            <div class="form-group">
                                <label for="landArea">
                                    Land Details (Area)
                                </label>

                                <input type="text" id="landArea" placeholder="e.g. 5 acres" required>
                            </div>

                        </div>

                    </section>

                    <!-- =========================
                         OTHER DETAILS
                    ========================== -->

                    <section class="form-section">

                        <h2 class="form-heading">
                            Other Details
                        </h2>

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="pincode">
                                    PIN Code
                                </label>

                                <input type="text" id="pincode" placeholder="Enter PIN code" maxlength="6" required>
                            </div>

                            <div class="form-group">
                                <label for="district">
                                    District
                                </label>

                                <input type="text" id="district" placeholder="Enter district" required>
                            </div>

                            <div class="form-group">
                                <label for="mandi">
                                    Mandi
                                </label>

                                <select id="mandi" required>
                                    <option value="">Select Mandi</option>
                                    <option value="Faridabad Mandi">Faridabad Mandi</option>
                                    <option value="Karnal Mandi">Karnal Mandi</option>
                                    <option value="Ambala Mandi">Ambala Mandi</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="desiredDate">
                                    Date
                                </label>

                                <input type="date" id="desiredDate" required>
                            </div>

                            <!-- TIME SLOTS -->

                            <div class="form-group full">
                                <label>
                                    Time Slots
                                </label>

                                <div class="time-slots">
                                    <input type="radio" id="slot1" name="timeSlot" value="08:00 - 10:00" required>
                                    <label for="slot1">8–10</label>

                                    <input type="radio" id="slot2" name="timeSlot" value="11:00 - 13:00">
                                    <label for="slot2">11–1</label>

                                    <input type="radio" id="slot3" name="timeSlot" value="14:00 - 16:00">
                                    <label for="slot3">2–4</label>

                                    <input type="radio" id="slot4" name="timeSlot" value="17:00 - 18:00">
                                    <label for="slot4">5–6</label>
                                </div>
                            </div>

                            <!-- VEHICLE -->

                            <div class="form-group">
                                <label for="vehicleNumber">
                                    Vehicle Number
                                </label>

                                <input type="text" id="vehicleNumber" placeholder="Enter vehicle number (e.g., HR-51-AB-1234)" required>
                            </div>

                            <div class="form-group">
                                <label for="vehicleType">
                                    Vehicle Type
                                </label>

                                <select id="vehicleType" required>
                                    <option value="Tractor">Tractor</option>
                                    <option value="Trolley">Trolley</option>
                                    <option value="Truck">Truck</option>
                                </select>
                            </div>

                        </div>

                    </section>

                    <!-- SUBMIT -->

                    <div class="submit-container">
                        <button type="submit" class="submit-btn">
                            Submit Gate Pass
                        </button>
                    </div>

                    <!-- SUCCESS -->

                    <div id="successMessage" class="success-message">
                        <h3>
                            ✓ Gate Pass Submitted
                        </h3>

                        <p>
                            Your gate pass request has been submitted successfully.
                        </p>
                    </div>

                </form>

            </div>

        </main>

    </div>

    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>

</body>

</html>
